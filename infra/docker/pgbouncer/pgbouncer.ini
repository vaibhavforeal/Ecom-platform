[databases]
platform = host=postgres port=5432 dbname=platform

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432

auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

; TRANSACTION pooling, not session pooling.
;
; This is the setting the tenancy model is built around. In transaction
; mode a connection returns to the pool at COMMIT, which is precisely why
; tenant context must be set with SET LOCAL (transaction-scoped) rather
; than SET (session-scoped). A session-level SET here would leak tenant
; context to the next request that borrows the connection.
;
; It is also why postgres.js is configured with `prepare: false` —
; prepared statements do not survive connection reuse in this mode, and
; the resulting errors only appear under concurrency.
pool_mode = transaction

max_client_conn = 500
default_pool_size = 20
min_pool_size = 5
reserve_pool_size = 5
reserve_pool_timeout = 3

server_idle_timeout = 60
server_lifetime = 3600

; Next.js and Drizzle send startup parameters PgBouncer does not
; recognise in transaction mode. Ignoring them is expected, not a
; workaround.
ignore_startup_parameters = extra_float_digits,options,search_path

log_connections = 0
log_disconnections = 0
stats_period = 60

admin_users = app_migrator
